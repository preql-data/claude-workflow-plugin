# Multi-tier CI for the claude-workflow-plugin.
#
# Tier matrix:
#   - lint           — shellcheck (advisory; never blocks).
#   - l1-unit        — bash unit tests (.claude/scripts/tests/).
#   - l2-component   — hook-pipeline component tests (.claude/tests/component/).
#                      Surfaces META-TEST counts as a distinct summary line so
#                      regression-injection sensitivity is visible at a glance.
#   - l3-vitest-unit — offline self-tests of the E2E harness (~55+ tests
#                      including the invariant engine specs from 0.8).
#   - manifest-validate — Zod-replica check of .claude-plugin/plugin.json.
#   - l3-live        — full live E2E suite. MANUAL ONLY (workflow_dispatch).
#                      Per phase 0.8, no automatic paid runs: no cron,
#                      no PR trigger, no push trigger. Live testing is a
#                      development-cycle activity, gated behind explicit
#                      operator invocation.
#
# Per 0.8, a normal PR or push run consumes ZERO API spend. The L4 daily
# drift watch is retired; goldens are debugging-only references.
#
# Permissions: contents:read for checkout. The live tier does not post
# PR comments (it only runs on workflow_dispatch, where there is no PR
# context).
#
# Portability:
#   - All jobs run on ubuntu-latest. shellcheck is pre-installed on the
#     standard runner image so the lint job just calls `make lint`.
#   - jq is also pre-installed.
#   - bd (Beads CLI): the l1-unit job installs the REAL bd from a pinned,
#     checksum-verified release tarball (a9hh — see the job's install
#     step). The historical claim that Beads had "no easy public
#     installer URL" stopped being true when steveyegge/beads started
#     publishing per-platform release binaries; pinning version + sha256
#     is deliberate (a tag can move, a digest cannot).
#   - Node 20 (LTS) for the L3 jobs; l1-unit also sets up node and runs
#     `npm ci` for BOTH MCP servers — bd-mcp (which
#     mcp-unestablished-results.test.sh drives) and code-graph-mcp (which
#     impact-report.test.sh section 4 drives live). Neither has install
#     scripts or native builds, so both are pure download+extract.
#
# BD_SHIM_ONLY=1 — now set ONLY on the l2-component job. Under it,
# bd-dependent specs (via lib/fixture.sh `bd_required_or_skip`) print a
# "SKIPPED:" line and exit 0. What the runner does with that, MEASURED
# rather than asserted (a9hh R7-F2 falsified this comment's earlier
# "never as passes / 7-spec remainder" claim; cmd: bd off PATH +
# BD_SHIM_ONLY=1, `bash .claude/tests/component/run.sh`, final a9hh
# R6/R7 bytes at HEAD 535c89a, macOS and ubuntu:24.04/aarch64 both):
#   Specs: Total: 44  Passed: 12  Failed: 1  Skipped: 31  Partial: 2
# A whole-file skip is SKIPPED (never a pass) under a COMPLETENESS
# caveat; a spec that ran assertions BEFORE its bd gate is PASSED with
# its executed count and counted Partial — the executed set this job
# really measures is 13 specs (12 passed + the pre-existing
# installer-v3-upgrade 8e-B failure), of which post-edit.sh (101 of its
# 115 assertions) and reviewer-lane-degradation.sh (4 of 8) are the two
# partials. 37 of 44 specs carry the helper, but how much of each
# executes before gating is a property of the spec's layout, not of the
# helper census — which is why the numbers above are measured, and why
# the job pins none of them (the assertion totals are additionally
# environment-sensitive). Installing bd here too — and putting an L2
# floor under the tier — is the recorded follow-up on a9hh (u84b); it
# was deliberately kept out of the L1 round so the l2-component job's
# semantics moved by one reviewed decision, not as a side effect.
#
# The L1 tier has NO skip mode any more: a9hh measured 286 of 2461
# assertions (11.6% of the tier, review-separation's 60 included)
# silently unexecuted under a byte-identical green summary. Precisely:
# five whole-file BD_SHIM_ONLY arms (bd-github-link, qa-gate-choose,
# qa-gate-grade-record, review-separation, phase5-synthetic-tests) and
# one section-level BD_SHIM_ONLY note arm (mcp-unestablished-results
# :489) were deleted. mcp-unestablished-results.test.sh KEEPS its
# whole-file node/node_modules arm at :115-122 — correctly: it names a
# prerequisite, and it is now classified SKIPPED and fails the tier, so
# this job installs the prerequisite instead of arguing with the arm.
# The runner classifies exit-0-with-zero-assertions as SKIPPED-not-
# passed, and a completeness floor (EXPECTED_SPECS) fails the run when
# the discovered set shrinks. See run-tests.sh's floor block — it is the
# negative control for the completeness line, and the pairing
# convention's first application.
#
# STRICT_SECTIONS=1 (l1-unit only) closes the granularity gap under it:
# the floor counts SPECS, so a spec that ran 24 of its 39 assertions and
# printed a `SKIPPED: section ...` marker still counted as "executed".
# That is how a9hh's own first fix round shipped a green 36/36 over 15
# unexecuted assertions. Under the flag a section skip is red — HERE,
# where every prerequisite is provisioned; unset elsewhere, where a dev
# machine may legitimately lack one.

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    # Manual trigger — runs the offline tiers AND the live tier
    # (l3-live gates itself on github.event_name == 'workflow_dispatch').

# Cancel stale runs on the same PR/branch when a new push arrives.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # Lint — non-blocking. shellcheck on all hook scripts.
  # ---------------------------------------------------------------------------
  lint:
    name: shellcheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify shellcheck available
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not on PATH (Makefile's lint target skips with log)"
            exit 0
          fi
          shellcheck --version
      - name: Run make lint
        run: make lint

  # ---------------------------------------------------------------------------
  # L1 — bash unit tests.
  # ---------------------------------------------------------------------------
  l1-unit:
    name: L1 — bash unit tests
    runs-on: ubuntu-latest
    # NO BD_SHIM_ONLY here any more (a9hh): this job installs the real bd
    # below, five whole-file BD_SHIM_ONLY skip arms and one section-level one
    # are deleted, and the runner's completeness floor fails the run if the
    # executed set ever shrinks again.
    #
    # THIS JOB IS THE STRICT ENVIRONMENT. It provisions every prerequisite the
    # tier's section arms name — bd, node, AND both MCP servers' node_modules
    # — so STRICT_SECTIONS=1 below is defensible: here, a skipped section is a
    # dropped provisioning step or a new arm nobody provisioned, never "this
    # laptop doesn't have X". A section-granular sweep of all 36 specs at
    # 535c89a + this change set found exactly one arm that fired in this job
    # (impact-report.test.sh section 4, 15 assertions, fixed by the
    # code-graph-mcp step below); the arms that did NOT fire, and why, are:
    #   installer-flags 258/305/428  bd must not resolve under
    #                                /usr/bin:/bin:/usr/sbin:/sbin — hence bd
    #                                is installed to /usr/local/bin below, and
    #                                moving it into /usr/bin would silently
    #                                skip three positive-control sections
    #   installer-flags 195          only when plugin.json is on a 3.x version
    #   workflow-manifest 6, META 4  need the release tag + frozen table:
    #                                fetch-depth: 0 above, manifests/ in-tree
    #   workflow-manifest 532        needs a non-root uid (GitHub runners are
    #   gate-claim-honesty 1247      the `runner` user, not root)
    #   impact-report 3/4 (node),
    #     6 (sha256sum), 4 (tmpdir
    #     inside a git checkout)     node via setup-node; coreutils; mktemp
    #                                gives /tmp, which is not a checkout
    #   mcp-deps-preserve 347        npm, via setup-node
    #   workflow-doctor 5a, META-TEST
    #     3/4/5                      fire only when the live repo moves under
    #                                the run, when bd/node_modules are absent
    #                                (both provisioned here), or when their own
    #                                control failed
    #   mcp-unestablished-results,
    #     worktree-sweep             WHOLE-FILE arms (node/node_modules; jq+git)
    #                                — already red as SKIPPED since a9hh, and
    #                                provisioned here
    # Two arms are NOT marker-shaped and so are invisible to STRICT_SECTIONS.
    # Both were checked by hand and neither can fire in this job:
    #   mutation-harness 652         `if command -v jq` guards one assertion
    #                                silently — unreachable, because
    #                                run-tests.sh itself exits 2 without jq
    #   gate-claim-honesty 542/2086, git/make/jq absences that `exit 2` or
    #     packaging-parity 398       `exit 1` — a FAILURE, never a skip
    # And no spec exits 0 part-way through after running assertions: every
    # mid-file `exit 0` in the tier is inside a fixture heredoc (checked).
    # That list is a snapshot, which is exactly why STRICT_SECTIONS exists:
    # the next arm added does not need anyone to redo the sweep.
    env:
      STRICT_SECTIONS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: tests/workflow-manifest.test.sh section 6
          # regenerates the current release's frozen table from that release's
          # TAG (git archive) and byte-compares. The default shallow
          # single-branch checkout has no tags to archive, and that section
          # degrades to a `note:` skip rather than a failure — so without this
          # the guard would be silently vacuous on every CI run, which is the
          # one outcome indistinguishable from green. Same reason l2-component
          # below sets it (claude-workflow-plugin-ce5).
          fetch-depth: 0
      - name: Install bd (Beads CLI) — pinned release, checksum-verified
        # a9hh: five L1 specs (233 assertions, review-separation's 60-strong
        # separation guard included) need the real bd and used to skip-with-
        # log in CI, which the old runner scored as PASSED. Pinned to the
        # exact version dev machines run (1.1.2) and verified against the
        # release digest, so a moved tag or a tampered tarball fails loudly
        # here instead of executing.
        #
        # /usr/local/bin IS LOAD-BEARING, not a default. installer-flags.test.sh
        # probes a deliberately prereq-hostile PATH of
        # /usr/bin:/bin:/usr/sbin:/sbin and skips three positive-control
        # sections if bd resolves under it. Installing into /usr/bin would
        # therefore trade five specs' coverage for three sections' — silently,
        # before STRICT_SECTIONS existed.
        run: |
          curl -fsSL --retry 3 -o /tmp/beads.tar.gz \
            "https://github.com/steveyegge/beads/releases/download/v1.1.2/beads_1.1.2_linux_amd64.tar.gz"
          echo "a72d71ed374955dc9f83a0f90b54bd7b6a0016709dd1676ae2e368651ed401c2  /tmp/beads.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/beads.tar.gz -C /usr/local/bin bd
          bd version
      - uses: actions/setup-node@v4
        with:
          # For BOTH MCP servers' deps below (engines: node >=18.17). Same
          # LTS the L3 jobs pin.
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            .claude/mcp/bd-mcp/package-lock.json
            .claude/mcp/code-graph-mcp/package-lock.json
      - name: Install bd-mcp deps (mcp-unestablished-results.test.sh)
        # Without node_modules the spec whole-file-skips, and since a9hh a
        # skip fails the tier (SKIP IS NOT A PASS) — so CI provisions what
        # the spec needs instead of green-lighting its absence.
        run: npm ci
        working-directory: .claude/mcp/bd-mcp
      - name: Install code-graph-mcp deps (impact-report.test.sh section 4)
        # a9hh R1-F1. The step above provisioned one of two MCP servers, and
        # the tier went green over the other: impact-report.test.sh executed
        # 24 of 39 assertions, printing `SKIPPED: section 4 (code-graph-mcp
        # not installed ...)`, under a `Total: 36  Passed: 36  Failed: 0
        # Skipped: 0` / floor-HELD summary, rc=0. Section 4 is the LIVE
        # code-graph path — server=code-graph, exit-0-despite-one-per-file-
        # error, the non-git relativisation fallback — i.e. the live half of
        # the artifact `qa-gate.sh approve` refuses to run without.
        # 94 packages, no install scripts, no native builds (sql.js and
        # web-tree-sitter are WASM), ~45M.
        run: npm ci
        working-directory: .claude/mcp/code-graph-mcp
      - name: Verify dependencies
        # Fail HERE, naming the missing thing, rather than three minutes later
        # as a section skip inside a spec. The two node_modules checks are the
        # cheap guard on the two steps above actually having done something.
        run: |
          jq --version
          bash --version | head -1
          bd version
          node --version
          for d in bd-mcp code-graph-mcp; do
            if [ ! -d ".claude/mcp/$d/node_modules" ]; then
              echo "MISSING: .claude/mcp/$d/node_modules — the npm ci step for it did not run or did not land." >&2
              echo "  Specs keyed on it would skip, and STRICT_SECTIONS=1 would fail the suite in a less obvious place." >&2
              exit 1
            fi
          done
      - name: Run L1 suite
        # STRICT_SECTIONS=1 comes from the job env above: in THIS environment a
        # spec that skips a section fails the tier.
        run: bash .claude/scripts/tests/run-tests.sh

  # ---------------------------------------------------------------------------
  # L2 — component tier. Hook-pipeline tests with crafted stdin envelopes.
  # ---------------------------------------------------------------------------
  l2-component:
    name: L2 — component (hook pipelines)
    runs-on: ubuntu-latest
    env:
      BD_SHIM_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: specs/installer-v3-upgrade.sh builds its
          # fixture from the v3.5.0 tag (git archive), and the default
          # shallow single-branch checkout has no tags to archive.
          fetch-depth: 0
      - name: Verify dependencies
        run: |
          jq --version
          bash --version | head -1
      - name: Run L2 suite with full output capture
        id: run
        run: |
          set -o pipefail
          bash .claude/tests/component/run.sh 2>&1 | tee component-tier.log
      - name: Surface META-TEST summary (distinct category)
        if: always()
        run: |
          # META-TESTs prove the test's own sensitivity (vs regular
          # assertions, which prove SUT behaviour). We tally them
          # separately. The pattern matches both helper-emitted lines
          # (assert_eq with a META-TEST name) and ad-hoc inline
          # PASS/FAIL prints.
          total=$(grep -cE '^\s*(PASS|FAIL):\s+.*META-TEST' component-tier.log || true)
          pass=$(grep -cE '^\s*PASS:\s+.*META-TEST' component-tier.log || true)
          fail=$(grep -cE '^\s*FAIL:\s+.*META-TEST' component-tier.log || true)
          {
            echo "### META-TEST assertions"
            echo ""
            echo "_Distinct from regular assertions — META-TESTs prove the test's own sensitivity, not the SUT's behaviour._"
            echo ""
            echo "- Total: **${total}**"
            echo "- Passed: **${pass}**"
            echo "- Failed: **${fail}**"
            if [ "$fail" -gt 0 ]; then
              echo ""
              echo "Failures:"
              grep -E '^\s*FAIL:\s+.*META-TEST' component-tier.log | head -10 | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload component-tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-tier-log
          path: component-tier.log
          retention-days: 14

  # ---------------------------------------------------------------------------
  # L3 unit tier — offline self-tests of the e2e harness, including the
  # invariant engine specs introduced in 0.8. No API key.
  # ---------------------------------------------------------------------------
  l3-vitest-unit:
    name: L3 — vitest unit (offline harness self-tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Cache npm by the package-lock for this workspace.
          cache: "npm"
          cache-dependency-path: .claude/tests/e2e/package-lock.json
      - name: Install harness dependencies
        # --include=optional is defensive: `npm ci` already installs
        # optionalDependencies by default, but on ubuntu-latest the
        # @anthropic-ai/claude-agent-sdk's platform-specific glibc
        # native binary (`@anthropic-ai/claude-agent-sdk-linux-x64`)
        # was being skipped in favour of the musl variant. Forcing
        # the flag pins the behaviour against future npm changes
        # and any cache-state edge cases.
        run: npm ci --include=optional
      - name: Verify SDK glibc native binary present
        # Defensive: this tier doesn't invoke the SDK binary (it's
        # offline unit tests), but a missing glibc variant here is the
        # same upstream symptom that breaks the live tier. Failing here
        # gives an earlier, clearer signal.
        run: |
          if [ -d node_modules/@anthropic-ai/claude-agent-sdk-linux-x64 ]; then
            echo "OK: glibc native binary installed"
            ls -la node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/ | head -5
          else
            echo "FAIL: expected glibc variant missing"
            ls -la node_modules/@anthropic-ai/ 2>&1 | head -20
            exit 1
          fi
      - name: Run offline unit tier
        run: npm run test:unit
      - name: Sanity-check test count
        # The spec calls for a meaningful unit tier (~55+ tests including
        # the new invariant engine specs from 0.8). A regression that
        # drops the count below 50 likely means the test:unit filter
        # missed files; we fail loudly so it's caught.
        run: |
          mkdir -p .tmp
          npx vitest run unit.spec --reporter=json --outputFile=.tmp/unit-results.json
          count=$(jq '[.testResults[].assertionResults[]] | length' .tmp/unit-results.json)
          echo "Unit tests collected: $count"
          if [ "$count" -lt 50 ]; then
            echo "ERROR: unit test count fell below the floor of 50 (got $count)."
            echo "       Did the test:unit glob lose a file?"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Manifest validation — Zod-replica check of .claude-plugin/plugin.json.
  # Cheap, fast; runs separately from the unit tier so a manifest break
  # surfaces as its own check.
  # ---------------------------------------------------------------------------
  manifest-validate:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: .claude/tests/e2e/package-lock.json
      - name: Install harness dependencies
        run: npm ci
      - name: Validate manifest
        run: npx tsx lib/validate-plugin-manifest.ts

  # ---------------------------------------------------------------------------
  # L3 live tier — MANUAL ONLY.
  #
  # Per 0.8 (cross-cutting principle #9): no automatic paid runs. This
  # job runs only when an operator manually dispatches the workflow via
  # the GitHub UI or `gh workflow run`. It does NOT run on pull_request
  # or push. There is no PR context, so it does not post PR comments;
  # results land in $GITHUB_STEP_SUMMARY and as workflow artifacts.
  #
  # Live runs are also invariant-asserted now (0.8): the specs no
  # longer gate on golden-trace equality. A successful run = invariants
  # held. Cassette refresh, if anyone wants one, is a deliberate
  # `make cassette-diff` step on a dev machine.
  # ---------------------------------------------------------------------------
  l3-live:
    name: L3 — live (real Claude, manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [l3-vitest-unit, manifest-validate]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: .claude/tests/e2e
    steps:
      - name: Require API key (manual dispatch implies live intent)
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "L3-live was dispatched without ANTHROPIC_API_KEY set."
            echo "Set the secret on this repo and re-dispatch."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: .claude/tests/e2e/package-lock.json
      - name: Install harness dependencies
        run: npm ci --include=optional
      - name: Remove musl SDK variant; verify glibc variant present
        # The SDK's native-binary lookup tries the musl variant first
        # on linux and short-circuits the moment require.resolve()
        # succeeds — without checking the binary actually runs. On
        # ubuntu-latest (glibc), the musl tarball's `claude` file is
        # present but its dynamic linker isn't. Surgical fix: remove
        # the musl variant so the lookup falls through to glibc.
        run: |
          musl="node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl"
          gnu="node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude"
          if [ -d "$musl" ]; then
            echo "Removing musl variant: $musl"
            rm -rf "$musl"
          fi
          if [ -f "$gnu" ]; then
            echo "OK: glibc binary present"
            ls -l "$gnu"
          else
            echo "ERROR: glibc native binary missing at $gnu"
            ls node_modules/@anthropic-ai/ 2>&1 || true
            exit 1
          fi
      - name: Run full E2E suite (live)
        run: npm run test:run
      - name: Summarize live results
        if: always()
        run: |
          set -u
          {
            echo "## L3 live results"
            echo ""
            echo "Triggered manually via workflow_dispatch. Live e2e ran"
            echo "against real Claude; invariants are the gate (per 0.8 —"
            echo "no golden-trace equality)."
            echo ""
            if [ -d cassettes/replays ]; then
              echo "Replays produced this run:"
              for r in cassettes/replays/*.jsonl; do
                [ -e "$r" ] || continue
                echo "- $(basename "$r")"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-live-artifacts
          path: |
            .claude/tests/e2e/cassettes/replays/
            .claude/tests/e2e/.tmp/
          retention-days: 30
